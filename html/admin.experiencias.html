<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantenedor de experiencias | Tarot y Otras Artes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body class="admin-cuerpo" data-pagina-admin="experiencias">
    <div class="admin-layout">
      <aside class="admin-sidebar" id="adminSidebar"></aside>

      <main class="admin-contenido">
        <header class="admin-encabezado">
          <h1>Experiencias</h1>
          <a
            class="btn boton-admin-primario"
            href="admin-experiencias-form.html"
          >
            + Nueva experiencia
          </a>
        </header>

        <div class="admin-cuerpo-contenido">
          <div class="admin-tabla">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <caption class="visually-hidden">
                  Listado de experiencias del catálogo
                </caption>
                <thead>
                  <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Categoría</th>
                    <th scope="col">Precio</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-end">Acciones</th>
                  </tr>
                </thead>
                <tbody id="cuerpoTablaExperiencias"></tbody>
              </table>
            </div>
          </div>

          <div id="mensajeAdminExperiencias" class="mt-3" role="status"></div>
        </div>
      </main>
    </div>

    <script src="js/datos-experiencias.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/admin-experiencias.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
