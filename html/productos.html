<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Tarot y Otras Artes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado-principal sticky-top"><!-- mismo header que index --></header>

  <main>
    <section class="cabecera-pagina">
      <div class="container">
        <p class="etiqueta-portada">Catálogo completo</p>
        <h1>Nuestros productos</h1>
        <p>Mazos, cristales, velas, servicios y cursos. Filtra y encuentra lo que necesitas.</p>
      </div>
    </section>

    <section class="seccion-catalogo">
      <div class="container">
        <form class="row g-3 mb-4" id="form-filtros" onsubmit="return false;">
          <div class="col-md-6">
            <label for="buscar" class="form-label">Buscar</label>
            <input type="search" id="buscar" class="form-control" placeholder="Nombre del producto...">
          </div>
          <div class="col-md-4">
            <label for="filtro-categoria" class="form-label">Categoría</label>
            <select id="filtro-categoria" class="form-select">
              <option value="">Todas</option>
              <option value="tarot">Tarot</option>
              <option value="cristales">Cristales</option>
              <option value="velas">Velas y rituales</option>
              <option value="servicios">Servicios</option>
            </select>
          </div>
        </form>

        <div id="lista-productos" class="row g-4"></div>
      </div>
    </section>
  </main>

  <footer class="pie-pagina">
    <div class="container">
      <p class="copyright-footer">© 2025 Tarot y Otras Artes</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
