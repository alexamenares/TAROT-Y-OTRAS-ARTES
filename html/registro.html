<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Tarot y Otras Artes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo"><img src="img/logo.png" alt="Logo" width="40"><span>Tarot y Otras Artes</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
      </ul>
      <a href="carrito.html" class="cart-link">🛒 <span id="cart-count">0</span></a>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h1>Registro de usuario</h1>
      <form id="form-registro" novalidate>
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" maxlength="100" autocomplete="name" required>
          <small class="error" id="error-nombre"></small>
        </div>

        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" maxlength="100" autocomplete="email" required>
          <small class="error" id="error-correo"></small>
        </div>

        <div class="form-group">
          <label for="correo2">Confirmar correo</label>
          <input type="email" id="correo2" name="correo2" maxlength="100" autocomplete="email" required>
          <small class="error" id="error-correo2"></small>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" minlength="4" maxlength="10" autocomplete="new-password" required>
          <small class="error" id="error-password"></small>
        </div>

        <div class="form-group">
          <label for="password2">Confirmar contraseña</label>
          <input type="password" id="password2" name="password2" minlength="4" maxlength="10" autocomplete="new-password" required>
          <small class="error" id="error-password2"></small>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono (opcional)</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="region">Región</label>
            <select id="region" required><option value="">Seleccione una región</option></select>
            <small class="error" id="error-region"></small>
          </div>
          <div class="form-group">
            <label for="comuna">Comuna</label>
            <select id="comuna" required><option value="">Seleccione una comuna</option></select>
            <small class="error" id="error-comuna"></small>
          </div>
        </div>

        <button type="submit" class="btn-primary">REGISTRAR</button>
      </form>
    </section>
  </main>

  <footer class="site-footer"><p class="copyright">© 2025 Tarot y Otras Artes</p></footer>

  <script src="js/regiones.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
