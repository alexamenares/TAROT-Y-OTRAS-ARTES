<form id="form-contacto" novalidate>
  <div class="form-group">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" maxlength="100" required>
    <small class="error" id="error-nombre"></small>
  </div>
  <div class="form-group">
    <label for="correo">Correo</label>
    <input type="email" id="correo" maxlength="100" required>
    <small class="error" id="error-correo"></small>
  </div>
  <div class="form-group">
    <label for="comentario">Comentario</label>
    <textarea id="comentario" maxlength="500" rows="5" required></textarea>
    <small class="error" id="error-comentario"></small>
    <small class="contador"><span id="contador">0</span>/500</small>
  </div>
  <button type="submit" class="btn-primary">ENVIAR MENSAJE</button>
</form>
