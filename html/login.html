<form id="form-login" novalidate>
  <div class="form-group">
    <label for="correo">Correo</label>
    <input type="email" id="correo" maxlength="100" autocomplete="email" required>
    <small class="error" id="error-correo"></small>
  </div>
  <div class="form-group">
    <label for="password">Contraseña</label>
    <input type="password" id="password" minlength="4" maxlength="10" required>
    <small class="error" id="error-password"></small>
  </div>
  <button type="submit" class="btn-primary">Iniciar sesión</button>
</form>
