<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar experiencia | Tarot y Otras Artes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body class="admin-cuerpo" data-pagina-admin="experiencias">
    <div class="admin-layout">
      <aside class="admin-sidebar" id="adminSidebar"></aside>

      <main class="admin-contenido">
        <header class="admin-encabezado">
          <h1 id="tituloFormulario">Nueva experiencia</h1>
          <a
            class="btn boton-admin-secundario"
            href="admin-experiencias.html"
          >
            Volver al listado
          </a>
        </header>

        <div class="admin-cuerpo-contenido">
          <form class="admin-form" id="formularioExperiencia" novalidate>
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label" for="nombreExperiencia">
                  Nombre *
                </label>
                <input
                  class="form-control"
                  id="nombreExperiencia"
                  maxlength="100"
                  type="text"
                />
                <div
                  class="mensaje-validacion"
                  id="mensajeNombreExperiencia"
                ></div>
              </div>

              <div class="col-md-4">
                <label class="form-label" for="categoriaExperiencia">
                  Categoría *
                </label>
                <select class="form-select" id="categoriaExperiencia">
                  <option value="">Selecciona una categoría</option>
                  <option value="TIRADA DE TAROT">Tirada de Tarot</option>
                  <option value="LECTURA GUIADA">Lectura guiada</option>
                  <option value="MEDITACIÓN">Meditación</option>
                  <option value="RITUAL">Ritual</option>
                </select>
                <div
                  class="mensaje-validacion"
                  id="mensajeCategoriaExperiencia"
                ></div>
              </div>

              <div class="col-12">
                <label class="form-label" for="descripcionExperiencia">
                  Descripción (opcional, máx. 500)
                </label>
                <textarea
                  class="form-control"
                  id="descripcionExperiencia"
                  maxlength="500"
                  rows="3"
                ></textarea>
                <div
                  class="mensaje-validacion"
                  id="mensajeDescripcionExperiencia"
                ></div>
              </div>

              <div class="col-md-4">
                <label class="form-label" for="precioExperiencia">
                  Precio referencial *
                </label>
                <input
                  class="form-control"
                  id="precioExperiencia"
                  min="0"
                  step="1"
                  type="number"
                />
                <div class="form-text">Usa 0 para experiencias gratuitas.</div>
                <div
                  class="mensaje-validacion"
                  id="mensajePrecioExperiencia"
                ></div>
              </div>

              <div class="col-md-4">
                <label class="form-label" for="imagenExperiencia">
                  Ruta de imagen
                </label>
                <input
                  class="form-control"
                  id="imagenExperiencia"
                  placeholder="imagenes/00-el-loco.png"
                  type="text"
                />
                <div
                  class="mensaje-validacion"
                  id="mensajeImagenExperiencia"
                ></div>
              </div>

              <div class="col-md-4">
                <label class="form-label" for="estadoExperiencia">
                  Estado *
                </label>
                <select class="form-select" id="estadoExperiencia">
                  <option value="publicado">Publicado</option>
                  <option value="revision">En revisión</option>
                  <option value="borrador">Borrador</option>
                  <option value="archivado">Archivado</option>
                </select>
              </div>
            </div>

            <div id="mensajeFormularioExperiencia" class="mt-4" role="status"></div>

            <div class="d-flex flex-wrap gap-3 mt-4">
              <button class="btn boton-admin-primario" type="submit">
                Guardar experiencia
              </button>
              <a
                class="btn boton-admin-secundario"
                href="admin-experiencias.html"
              >
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="js/datos-experiencias.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/admin-experiencias.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
