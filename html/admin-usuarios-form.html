<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar usuario | Tarot y Otras Artes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body class="admin-cuerpo" data-pagina-admin="usuarios">
    <div class="admin-layout">
      <aside class="admin-sidebar" id="adminSidebar"></aside>

      <main class="admin-contenido">
        <header class="admin-encabezado">
          <h1 id="tituloFormularioUsuario">Nuevo usuario</h1>
          <a
            class="btn boton-admin-secundario"
            href="admin-usuarios.html"
          >
            Volver al listado
          </a>
        </header>

        <div class="admin-cuerpo-contenido">
          <form class="admin-form" id="formularioUsuario" novalidate>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label" for="runUsuario">RUN *</label>
                <input
                  class="form-control"
                  id="runUsuario"
                  placeholder="19011022K"
                  type="text"
                />
                <div class="form-text">Sin puntos ni guion. Ej: 19011022K</div>
                <div class="mensaje-validacion" id="mensajeRunUsuario"></div>
              </div>

              <div class="col-md-4">
                <label class="form-label" for="nombreUsuario">Nombre *</label>
                <input
                  class="form-control"
                  id="nombreUsuario"
                  maxlength="50"
                  type="text"
                />
                <div class="mensaje-validacion" id="mensajeNombreUsuario"></div>
              </div>

              <div class="col-md-4">
                <label class="form-label" for="apellidosUsuario">
                  Apellidos *
                </label>
                <input
                  class="form-control"
                  id="apellidosUsuario"
                  maxlength="100"
                  type="text"
                />
                <div
                  class="mensaje-validacion"
                  id="mensajeApellidosUsuario"
                ></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="correoUsuario">Correo *</label>
                <input
                  class="form-control"
                  id="correoUsuario"
                  maxlength="100"
                  type="email"
                />
                <div class="mensaje-validacion" id="mensajeCorreoUsuario"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="telefonoUsuario">
                  Teléfono (opcional)
                </label>
                <input
                  class="form-control"
                  id="telefonoUsuario"
                  placeholder="+56912345678"
                  type="tel"
                />
                <div
                  class="mensaje-validacion"
                  id="mensajeTelefonoUsuario"
                ></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="regionUsuario">Región *</label>
                <select class="form-select" id="regionUsuario">
                  <option value="">Selecciona una región</option>
                </select>
                <div class="mensaje-validacion" id="mensajeRegionUsuario"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="comunaUsuario">Comuna *</label>
                <select class="form-select" id="comunaUsuario">
                  <option value="">Selecciona una comuna</option>
                </select>
                <div class="mensaje-validacion" id="mensajeComunaUsuario"></div>
              </div>

              <div class="col-12">
                <label class="form-label" for="direccionUsuario">
                  Dirección *
                </label>
                <input
                  class="form-control"
                  id="direccionUsuario"
                  maxlength="300"
                  type="text"
                />
                <div
                  class="mensaje-validacion"
                  id="mensajeDireccionUsuario"
                ></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="fechaNacimientoUsuario">
                  Fecha de nacimiento (opcional)
                </label>
                <input
                  class="form-control"
                  id="fechaNacimientoUsuario"
                  type="date"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label" for="rolUsuario">Rol *</label>
                <select class="form-select" id="rolUsuario">
                  <option value="">Selecciona un rol</option>
                  <option value="admin">Administrador</option>
                  <option value="guia">Guía</option>
                  <option value="consultante">Consultante</option>
                </select>
                <div class="mensaje-validacion" id="mensajeRolUsuario"></div>
              </div>
            </div>

            <div id="mensajeFormularioUsuario" class="mt-4" role="status"></div>

            <div class="d-flex flex-wrap gap-3 mt-4">
              <button class="btn boton-admin-primario" type="submit">
                Guardar usuario
              </button>
              <a
                class="btn boton-admin-secundario"
                href="admin-usuarios.html"
              >
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="js/datos-usuarios.js"></script>
    <script src="js/regiones-comunas.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/admin-usuarios.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
