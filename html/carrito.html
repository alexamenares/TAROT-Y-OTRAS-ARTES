<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Tarot y Otras Artes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado-principal sticky-top"><!-- mismo header --></header>

  <main>
    <section class="cabecera-pagina">
      <div class="container">
        <p class="etiqueta-portada">Tu selección</p>
        <h1>Mi carrito de compras</h1>
        <p>Revisa, ajusta cantidades y confirma tu pedido.</p>
      </div>
    </section>

    <section class="seccion-catalogo">
      <div class="container">
        <div id="carrito-vacio" class="text-center py-5 d-none">
          <p class="mb-3">Tu carrito está vacío.</p>
          <a href="productos.html" class="btn btn-portada-principal">Ir a productos</a>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="table-responsive">
              <table id="tabla-carrito" class="table tabla-admin align-middle">
                <thead>
                  <tr>
                    <th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th>
                  </tr>
                </thead>
                <tbody id="carrito-body"></tbody>
              </table>
            </div>
          </div>
          <div class="col-lg-4">
            <aside class="tarjeta-admin">
              <h2 style="font-family: Georgia, serif;">Resumen</h2>
              <p class="d-flex justify-content-between"><span>Total:</span> <strong id="total-carrito">$0</strong></p>
              <button id="btn-pagar" class="btn btn-portada-principal w-100 mt-3">PAGAR</button>
            </aside>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie-pagina">
    <div class="container"><p class="copyright-footer">© 2025 Tarot y Otras Artes</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
